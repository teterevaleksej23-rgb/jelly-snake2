<html lang="ru">
<head>

<style>
:root{--bg:#e6f2d8;--panel:#fff;--ink:#23402a;--muted:#6b8570;--line:#d4e5c6;--accent:#4e7cf6;--hi:#fff3c4;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17241a;--panel:#213427;--ink:#e6f2dc;--muted:#93ad98;--line:#2f4936;--hi:#3d4a22}}
:root[data-theme="dark"]{--bg:#17241a;--panel:#213427;--ink:#e6f2dc;--muted:#93ad98;--line:#2f4936;--hi:#3d4a22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px;touch-action:manipulation}
h1{margin:0;font-size:2rem;font-weight:600}
.hud{display:flex;gap:10px;width:min(94vw,560px)}
.chip{flex:1;background:var(--panel);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:600;box-shadow:0 3px 0 var(--line)}
.chip small{font-weight:400;color:var(--muted);font-size:.8rem;display:block;line-height:1}
.dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8d7f,#d4151f 70%);flex:none}
.cup{font-size:1.3rem}
#wrap{position:relative;width:min(94vw,560px);aspect-ratio:17/15;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--line),0 14px 24px rgba(0,0,0,.18)}
canvas{width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,40,25,.55);backdrop-filter:blur(2px);color:#fff;text-align:center;padding:16px}
#t{font-size:1.5rem;font-weight:600}
#sub{font-size:1rem;opacity:.9;min-height:1.2em}
input{font:inherit;text-align:center;border:0;border-radius:12px;padding:8px 12px;width:200px;background:#fff;color:#23402a}

#wrap.rw::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px);pointer-events:none}

.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.ib{width:36px;height:36px;padding:0;font-size:1.1rem;border-radius:50%;background:rgba(255,255,255,.85);color:#23402a;box-shadow:0 3px 0 rgba(0,0,0,.2)}

.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;transform:rotate(-3deg);z-index:2}
.l1{font-size:clamp(4rem,22vw,6.2rem);font-weight:600;color:#8ee34f;-webkit-text-stroke:7px #1f7a2c;paint-order:stroke fill;text-shadow:0 7px 0 #1f7a2c,0 12px 16px rgba(0,0,0,.25)}

@keyframes beat{50%{transform:scale(1.06)}}
.mrow{display:flex;gap:10px;z-index:2;flex-wrap:wrap;justify-content:center;margin-top:8px}
.cl{position:absolute;background:#fff;border-radius:60px;opacity:.95;animation:drift 40s linear infinite;z-index:1}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:50%;height:150%;left:15%;top:-60%}.cl::after{width:38%;height:120%;right:12%;top:-40%}
.c1{width:150px;height:44px;top:9%;left:-20%}.c2{width:110px;height:34px;top:30%;left:-30%;animation-duration:55s;animation-delay:-20s}.c3{width:130px;height:38px;top:52%;left:-25%;animation-duration:48s;animation-delay:-8s}

.hill{position:absolute;border-radius:50%;bottom:-24vh;z-index:0}
.hl1{width:130vw;height:46vh;left:-20vw;background:linear-gradient(#8fd957,#6cc040)}
.hl2{width:100vw;height:34vh;right:-30vw;bottom:-18vh;background:linear-gradient(#a6e45f,#7ccd48)}
.tree{position:absolute;left:-14px;bottom:14vh;width:90px;height:150px;z-index:1}
.tree i{position:absolute;left:34px;bottom:0;width:20px;height:80px;background:#8a5a2b;border-radius:6px}
.tree b{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a6e65a,#4aa72f)}
.tree b:nth-child(2){width:80px;height:80px;left:0;bottom:60px}.tree b:nth-child(3){width:64px;height:64px;left:20px;bottom:100px}.tree b:nth-child(4){width:60px;height:60px;left:-8px;bottom:36px}
#set{position:fixed;inset:0;z-index:60;background:rgba(10,30,15,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);color:var(--ink);border-radius:20px;padding:18px 20px;width:min(92vw,340px);display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--line)}

@media (prefers-reduced-motion:reduce){.cl,.play{animation:none}}

.seg button.on{background:linear-gradient(#6b93ff,#3f67e0);color:#fff;box-shadow:0 4px 0 #2a49a8}
.pad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(3,68px);gap:4px}
.pad button{padding:0;width:68px;height:68px;background:none;box-shadow:none;border:0;border-radius:0;touch-action:none;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.pad button svg{width:62px;height:62px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22));transition:transform .06s}
.pad button:active{transform:none;box-shadow:none}.pad button:active svg{transform:scale(.88)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
#warn{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;align-items:center;gap:10px;background:rgba(211,47,47,.93);color:#fff;border-radius:16px;padding:6px 16px;font-weight:600;font-size:1.25rem;white-space:nowrap;animation:blink .5s steps(2,start) infinite;pointer-events:none}
#warn b{font-size:1.9rem}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#warn{animation:none}}
.board{width:min(94vw,560px);background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.board h2{margin:0 0 2px;font-size:1.25rem}
.board p{margin:0 0 8px;color:var(--muted);font-size:.85rem}
ol{margin:0;padding:0;list-style:none}
li{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;font-size:1.05rem}
li.me{background:var(--hi)}
li .n{width:1.6em;color:var(--muted)}
li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .sc{font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin:0;text-align:center}
</style>
</head>

<script>
(function(){

var $=function(i){return document.getElementById(i)};
var scoreEl=$('score'),bestEl=$('best'),lvlEl=$('lvl'),msg=$('msg'),tEl=$('t'),subEl=$('sub'),nick=$('nick'),toast=$('toast'),againEl=$('again'),wrapEl=$('wrap'),fxEl=$('fx'),menu=$('menu'),setEl=$('set');
var snake,dir,queue,food,score,best=0,state='idle',acc=0,last=0,stepMs=190,oldTail,grew,appleT=0,chomp=0,mouth=0,shake=0,parts=[],texts=[],deadAt=0,newRec=false,hang=0,DT=.016,lk={x:0,y:0},zoom=1,zt=1,ccx=340,ccy=300,tcx=340,tcy=300,trail=[],rh=0,rt=0,rhP=0,rtP=0,rlen=3,rwN=0,rh0=1,racc=0,rms=40,grown=false,paused=false,holdT=0,exploded=false,items=[],eff={slow:0,star:0,rush:0,mirror:0,ghost:0,fog:0,sway:0},shield=false,gameT=0,spawnT=5000,rings=[],flash=0,fxKey='',more=[],evT=20000,warn=null,lastW=0,mice=[],mouseT=6000,bonusGrow=0;

newRec=score>best;if(newRec){best=score;bestEl.textContent=best;ls('snake3d-best',best)}submit();
setTimeout(startRewind,800)}
function step(){if(queue.length)dir=queue.shift();var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},ei=more.findIndex(function(a){return a.x==h.x&&a.y==h.y}),eat=h.x==food.x&&h.y==food.y||ei>=0;

holdT=0;snake.unshift(h);trail.push({x:h.x,y:h.y});

if(lvl()+1>+lvlEl.textContent){lvlEl.textContent=lvl()+1;say('Скорость растёт!');sfx('up')}if(score>=50&&!grown){grown=true;grow();sfx('up')}}
else if(bonusGrow>0){bonusGrow--;grew=true}else{grew=false;oldTail=snake.pop()}pickItem(h)}
var AC=null,sfxG,musG,sfxV=.7,musV=.4,mTimer=null,mt=0,mi=0;
var sv=ls('snake3d-sfx'),mv=ls('snake3d-mus');if(sv!==null)sfxV=+sv;if(mv!==null)musV=+mv;
